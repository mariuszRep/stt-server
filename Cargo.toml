[package]
name = "stt-server-next"
version = "0.1.1"
edition = "2021"
license = "MIT"

[lib]
name = "stt_server_next"
path = "src/lib.rs"

[dependencies]
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["vulkan"] }
hound = "=3.5.1"
rubato = "=0.16.2"
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", features = ["stream", "rustls-tls", "json", "multipart"], default-features = false }
futures-util = "0.3"
uuid = { version = "=1.26.1", features = ["v4"] }
fs4 = "=1.1.0"
tower-http = { version = "=0.7.1", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
# Already a transitive dependency (via tokio) at 0.61.2; pinned exactly and
# taken on directly, with only the feature sets `GET /v1/local/system` needs
# (registry reads for OS/CPU name, GlobalMemoryStatusEx for RAM,
# GetLogicalProcessorInformation for physical core count, and
# GetProcessMemoryInfo for this process's working-set size), so no new
# transitive surface is added.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "stt-proof"
path = "src/main.rs"

[[bin]]
name = "stt-server-next"
path = "src/bin/server.rs"

[profile.release]
lto = true
codegen-units = 1
