[workspace]
members = [
    "crates/common",
    "crates/runtime",
    "crates/server",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/stt-server"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# UUIDs
uuid = { version = "1", features = ["v4"] }

# Platform directories
dirs = "5"

# Testing
proptest = "1"
reqwest = { version = "0.12", features = ["json"] }

# Shared crate
stt-common = { path = "crates/common" }
stt-runtime = { path = "crates/runtime" }
stt-server = { path = "crates/server" }

[profile.release]
lto = true
codegen-units = 1
strip = true
