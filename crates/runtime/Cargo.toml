[package]
name = "stt-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
stt-common.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["stream", "json", "multipart"] }
uuid.workspace = true
sysinfo = "0.32"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait.workspace = true
bzip2 = "0.6"
tar = "0.4"
# Lightweight, dependency-free (just serde) model manifest shared with
# sherpad itself -- so model file layouts are described once, not
# re-described here. Deliberately NOT a dependency on `sherpad`/`sherpa-onnx`
# (the heavy FFI crate with a native-library download): sherpa-manifest has
# no such dependency, so this path edge doesn't pull the native ONNX runtime
# into stt-server's own build, preserving the workspace isolation
# fold-sherpad-runtime-into-stt-server established.
sherpa-manifest = { path = "../../runtimes/sherpa-onnx/crates/sherpa-manifest" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
