<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>onnx-sherpa</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  select, button, textarea { font-size: 1rem; padding: 8px; }
  select { width: 100%; margin-bottom: 8px; }
  button { cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
  #recordBtn { background: #d33; color: white; border: none; border-radius: 6px; padding: 10px 20px; }
  #recordBtn.recording { background: #666; }
  #pullBtn { display: none; }
  textarea { width: 100%; height: 120px; margin-top: 12px; box-sizing: border-box; }
  #status { color: #666; margin: 8px 0; min-height: 1.2em; }
  .row { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
  <h1>onnx-sherpa &mdash; voice to text</h1>

  <div class="row">
    <select id="modelSelect"></select>
    <button id="pullBtn">Download model</button>
  </div>

  <button id="recordBtn">Record</button>
  <button id="copyBtn">Copy text</button>

  <div id="status"></div>
  <textarea id="result" placeholder="Transcribed text will appear here" readonly></textarea>

<script>
const statusEl = document.getElementById('status');
const modelSelect = document.getElementById('modelSelect');
const pullBtn = document.getElementById('pullBtn');
const recordBtn = document.getElementById('recordBtn');
const copyBtn = document.getElementById('copyBtn');
const resultEl = document.getElementById('result');

let models = [];
let mediaStream, audioContext, sourceNode, processorNode;
let chunks = [];
let recording = false;

function setStatus(msg) { statusEl.textContent = msg; }

async function loadModels() {
  const res = await fetch('/v1/models');
  models = await res.json();
  modelSelect.innerHTML = '';
  for (const m of models) {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = `${m.id} (${m.status}) - ${m.description}`;
    modelSelect.appendChild(opt);
  }
  updatePullButton();
}

function updatePullButton() {
  const m = models.find((m) => m.id === modelSelect.value);
  pullBtn.style.display = m && m.status === 'available' ? 'inline-block' : 'none';
}

modelSelect.addEventListener('change', updatePullButton);

pullBtn.addEventListener('click', async () => {
  const id = modelSelect.value;
  pullBtn.disabled = true;
  setStatus(`Downloading ${id}... this can take a minute for larger models.`);
  try {
    const res = await fetch(`/v1/models/${id}/pull`, { method: 'POST' });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    setStatus(`${id} downloaded.`);
    await loadModels();
    modelSelect.value = id;
  } catch (e) {
    setStatus(`Download failed: ${e.message}`);
  } finally {
    pullBtn.disabled = false;
  }
});

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

async function startRecording() {
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioContext = new AudioContext();
  sourceNode = audioContext.createMediaStreamSource(mediaStream);
  processorNode = audioContext.createScriptProcessor(4096, 1, 1);
  chunks = [];
  processorNode.onaudioprocess = (e) => {
    chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  sourceNode.connect(processorNode);
  processorNode.connect(audioContext.destination);
}

function stopRecording() {
  const sampleRate = audioContext.sampleRate;
  processorNode.disconnect();
  sourceNode.disconnect();
  mediaStream.getTracks().forEach((t) => t.stop());
  audioContext.close();

  const total = chunks.reduce((a, c) => a + c.length, 0);
  const merged = new Float32Array(total);
  let offset = 0;
  for (const c of chunks) { merged.set(c, offset); offset += c.length; }
  return encodeWav(merged, sampleRate);
}

recordBtn.addEventListener('click', async () => {
  if (!recording) {
    try {
      await startRecording();
    } catch (e) {
      setStatus(`Microphone error: ${e.message}`);
      return;
    }
    recording = true;
    recordBtn.textContent = 'Stop';
    recordBtn.classList.add('recording');
    setStatus('Recording... click Stop when done.');
  } else {
    recording = false;
    recordBtn.textContent = 'Record';
    recordBtn.classList.remove('recording');
    const wavBlob = stopRecording();
    setStatus('Transcribing...');
    try {
      const form = new FormData();
      form.append('file', wavBlob, 'recording.wav');
      form.append('model', modelSelect.value);
      form.append('response_format', 'json');
      const res = await fetch('/v1/audio/transcriptions', { method: 'POST', body: form });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const data = await res.json();
      resultEl.value = data.text;
      setStatus('Done.');
    } catch (e) {
      setStatus(`Transcription failed: ${e.message}`);
    }
  }
});

copyBtn.addEventListener('click', async () => {
  await navigator.clipboard.writeText(resultEl.value);
  setStatus('Copied to clipboard.');
});

loadModels().catch((e) => setStatus(`Could not reach sherpad: ${e.message}`));
</script>
</body>
</html>
