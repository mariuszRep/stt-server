name: CI

on:
  push:
    branches: [main]
  pull_request:

# No App or SDK checkout anywhere in this workflow — stt-server builds and
# tests entirely from its own repository, per CONVENTIONS.md ("never import
# SDK source by repository-relative path") and the goal's acceptance
# criteria ("Clean Server CI builds/tests without App or SDK checkouts").
jobs:
  rust:
    needs: sherpad
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Fetch the sherpad binary built by the `sherpad` job below, at exactly
      # the path crates/runtime/tests/support/mod.rs's
      # point_at_locally_built_runtimes() points STT_SHERPA_ONNX_RUNTIME_DIR
      # at -- so sherpa-onnx's general/engine-specific conformance tests run
      # for real here instead of loudly skipping for lack of a runtime
      # binary. Downloaded, not built a second time here, since the whole
      # point of splitting `sherpad` into its own job (see that job's own
      # comment) is to keep sherpa-onnx's native ONNX-runtime link out of
      # every `cargo build --workspace` run.
      - name: Fetch built sherpad binary
        uses: actions/download-artifact@v4
        with:
          name: sherpad-${{ matrix.os }}
          path: runtimes/sherpa-onnx/target/release

      - name: Make sherpad executable
        if: matrix.os != 'windows-latest'
        run: chmod +x runtimes/sherpa-onnx/target/release/sherpad

      # Unit/integration tests that spawn the real vendored faster-whisper
      # runtime (crates/runtime/tests/faster_whisper_integration.rs) need its
      # Python dependencies installed first; every other test runs regardless.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install managed-runtime Python dependencies
        working-directory: runtimes/faster-whisper
        run: |
          python -m venv venv
          ${{ matrix.os == 'windows-latest' && 'venv\Scripts\pip' || 'venv/bin/pip' }} install -r requirements.txt

      - name: Add managed-runtime venv to PATH
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "$GITHUB_WORKSPACE/runtimes/faster-whisper/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/runtimes/faster-whisper/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Test
        run: cargo test --workspace

      - name: Smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --bin stt
          chmod +x smoke-test.sh
          ./smoke-test.sh target/release/stt

      # Assert no batch/realtime transcription route or WebSocket upgrade
      # ever reappears on the control plane — cheap regression guard on top
      # of tests/auth.rs's structural assertions.
      - name: Data-path regression guard
        shell: bash
        run: |
          if grep -RIn "extract::ws" crates/server/src crates/runtime/src; then
            echo "::error::found a WebSocket extractor reference in the control plane — audio must never cross stt-server"
            exit 1
          fi

  # The sherpa-onnx managed runtime (runtimes/sherpa-onnx/) is deliberately
  # its own cargo workspace, not a member of the root one above — its native
  # ONNX-runtime library download/static-link shouldn't lengthen every
  # `cargo build --workspace` run. Built here as its own job for that reason.
  sherpad:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtimes/sherpa-onnx
    env:
      # audiopus_sys vendors and cmake-builds libopus from source (its
      # "static" feature -- see Cargo.toml). Its bundled libopus CMakeLists
      # still declares `cmake_minimum_required(VERSION 2.8)`; a current
      # CMake (verified: 4.x, which GitHub-hosted runners ship) refuses to
      # configure projects requiring < 3.5 at all, not just with a warning.
      # This is CMake's own documented escape hatch for exactly that case.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/sherpa-onnx
          # sherpa-onnx-sys downloads its prebuilt libs into target/sherpa-onnx-prebuilt,
          # which rust-cache would otherwise prune while keeping the build-script
          # output -- a cache hit then skips the download and fails to link
          # `sherpa-onnx-c-api`. The key suffix retires caches saved without it.
          key: sherpa-prebuilt-v1
          cache-directories: runtimes/sherpa-onnx/target/sherpa-onnx-prebuilt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --bin sherpad
      # Handed to the `rust` job above so it can run sherpa-onnx's
      # conformance tests for real, without building sherpad a second time.
      - name: Upload sherpad binary
        uses: actions/upload-artifact@v4
        with:
          name: sherpad-${{ matrix.os }}
          path: |
            runtimes/sherpa-onnx/target/release/sherpad
            runtimes/sherpa-onnx/target/release/sherpad.exe
          if-no-files-found: error
          retention-days: 1
