name: CI

# workflow_dispatch-only, deliberately — build/test already happens locally
# before a push, and candidate-server.yml (npm run vt -- server uat) is the
# real on-demand cloud-environment check. Not wired to push/PR: an automatic
# pass on every commit duplicates local testing without adding a check that
# isn't already happening somewhere more deliberate. Still runnable by hand
# for local debugging of the CI environment itself.
on:
  workflow_dispatch:

# No App or SDK checkout anywhere in this workflow — stt-server builds and
# tests entirely from its own repository, per CONVENTIONS.md ("never import
# SDK source by repository-relative path") and the goal's acceptance
# criteria ("Clean Server CI builds/tests without App or SDK checkouts").
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # audiopus_sys vendors and cmake-builds libopus from source (its
      # "static" feature -- see runtimes/sherpa-onnx/Cargo.toml). Its bundled
      # libopus CMakeLists still declares `cmake_minimum_required(VERSION 2.8)`;
      # a current CMake (verified: 4.x, which GitHub-hosted runners ship)
      # refuses to configure projects requiring < 3.5 at all, not just with a
      # warning. This is CMake's own documented escape hatch for exactly that case.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # The sherpa-onnx managed runtime (runtimes/sherpa-onnx/) is deliberately
      # its own cargo workspace, not a member of the root one — its native
      # ONNX-runtime library download/static-link shouldn't lengthen every
      # `cargo build --workspace` run. Built here as a step of this job (a
      # separate --release build, still not a workspace member) so the
      # conformance tests below run against it for real: the binary lands at
      # exactly the path crates/runtime/tests/support/mod.rs's
      # point_at_locally_built_runtimes() points STT_SHERPA_ONNX_RUNTIME_DIR
      # at. It used to cross jobs via upload-artifact — that created a
      # per-push artifact stream that fed the storage quota; building it
      # in-job creates nothing external at all.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/sherpa-onnx
          # sherpa-onnx-sys downloads its prebuilt libs into target/sherpa-onnx-prebuilt,
          # which rust-cache would otherwise prune while keeping the build-script
          # output -- a cache hit then skips the download and fails to link
          # `sherpa-onnx-c-api`. The key suffix retires caches saved without it.
          key: sherpa-prebuilt-v1
          cache-directories: runtimes/sherpa-onnx/target/sherpa-onnx-prebuilt

      - name: Format check (sherpa-onnx)
        working-directory: runtimes/sherpa-onnx
        run: cargo fmt --check

      - name: Clippy (sherpa-onnx)
        working-directory: runtimes/sherpa-onnx
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build sherpad
        working-directory: runtimes/sherpa-onnx
        run: cargo build --release --bin sherpad

      - name: Make sherpad executable
        if: matrix.os != 'windows-latest'
        run: chmod +x runtimes/sherpa-onnx/target/release/sherpad

      # Unit/integration tests that spawn the real vendored faster-whisper
      # runtime (crates/runtime/tests/faster_whisper_integration.rs) need its
      # Python dependencies installed first; every other test runs regardless.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # pip's own wheel cache, keyed on requirements.txt — the venv is
          # rebuilt per run but installs come from cache, not the network.
          cache: pip
          cache-dependency-path: runtimes/faster-whisper/requirements.txt

      - name: Install managed-runtime Python dependencies
        working-directory: runtimes/faster-whisper
        run: |
          python -m venv venv
          ${{ matrix.os == 'windows-latest' && 'venv\Scripts\pip' || 'venv/bin/pip' }} install -r requirements.txt

      - name: Add managed-runtime venv to PATH
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "$GITHUB_WORKSPACE/runtimes/faster-whisper/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/runtimes/faster-whisper/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Test
        run: cargo test --workspace

      - name: Smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --bin stt
          chmod +x smoke-test.sh
          ./smoke-test.sh target/release/stt

      # Assert no batch/realtime transcription route or WebSocket upgrade
      # ever reappears on the control plane — cheap regression guard on top
      # of tests/auth.rs's structural assertions.
      - name: Data-path regression guard
        shell: bash
        run: |
          if grep -RIn "extract::ws" crates/server/src crates/runtime/src; then
            echo "::error::found a WebSocket extractor reference in the control plane — audio must never cross stt-server"
            exit 1
          fi
