name: Server Candidate

# Builds the same artifacts release.yml later promotes (stt control plane,
# faster-whisper sidecar, sherpad) and uploads them as Actions artifacts for
# manual download/install — the candidate build is what a human
# acceptance-tests before tagging. workflow_dispatch-only, deliberately —
# matches stt-sdk and whisper-vibes: merging never auto-builds anywhere in
# this workspace, on any repo, public/free or not. Local build/test happens
# first; this is the on-demand cloud-environment check, run with
# `npm run vt -- server uat` from voice-typer/ root when you choose to run
# it. Each artifact carries a SHA256SUMS.txt that release.yml's promote step
# verifies before publishing. Does NOT create a GitHub Release and has no
# `contents: write` permission — structurally incapable of publishing. The
# 617MB faster-whisper GPU variant builds only behind the `gpu` input.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build (defaults to the current default branch)"
        required: false
        type: string
      gpu:
        description: "Also build the 617MB faster-whisper GPU variant (required before a release — verify-release.mjs downstream expects that asset)"
        required: false
        type: boolean
        default: false

jobs:
  # The three build legs are reusable-workflow calls — _build-*.yml holds the
  # single definition of each build (shared with any future caller), so the
  # release-asset shape can't drift. upload+checksums are on here because
  # release.yml promotes these artifacts; each artifact also carries a
  # manifest.json with {commit, run_id, run_url, builder, built_at} so the
  # provenance of every promoted binary is recorded next to its checksums.
  #
  # No version-ahead-of-latest-release check here on purpose: a candidate is
  # just "build + test the current commit," and most merges (CI/docs-only
  # changes) have nothing to bump. It's fine to build the same version
  # repeatedly — the version only has to be new at the moment you actually
  # TAG a release, which is where that check belongs (still enforced there:
  # release.yml refuses to run without a matching successful candidate, and
  # `git tag` itself refuses to create a tag name that already exists).
  build-binaries:
    uses: ./.github/workflows/_build-stt-binaries.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      upload: true
      upload-checksums: true
      retention-days: 7

  # The GPU variant is opt-in (workflow_dispatch -f gpu=true): at ~617MB it is
  # the single largest artifact and rarely the thing under test. A release
  # still requires it — release.yml hard-fails on a candidate run missing
  # faster-whisper-runtime-windows-gpu, so dispatch this once with gpu=true on
  # the tested SHA before tagging.
  build-faster-whisper:
    uses: ./.github/workflows/_build-faster-whisper.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      upload: true
      upload-checksums: true
      retention-days: 7
      include-gpu: ${{ inputs.gpu == true }}

  build-sherpad:
    uses: ./.github/workflows/_build-sherpad.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      upload: true
      upload-checksums: true
      retention-days: 7
