name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtualenv (Windows)
        if: matrix.platform == 'windows'
        run: python -m venv venv_win

      - name: Create virtualenv (Linux)
        if: matrix.platform == 'linux'
        run: python -m venv venv

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: venv_win\Scripts\pip.exe install -r requirements.txt pyinstaller

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: venv/bin/pip install -r requirements.txt pyinstaller

      - name: Build CPU sidecar (Windows)
        if: matrix.platform == 'windows'
        run: venv_win\Scripts\python.exe -m PyInstaller --clean --distpath dist voice-typer-backend.spec

      - name: Build CPU sidecar (Linux)
        if: matrix.platform == 'linux'
        run: venv/bin/python -m PyInstaller --clean --distpath dist voice-typer-backend.spec

      # CLI smoke test against the just-built binary — a broken CLI blocks the
      # release rather than shipping silently. Runs install (best-effort: Task
      # Scheduler/systemd user-session registration can fail in headless CI —
      # the CLI itself degrades gracefully and still starts the server; the
      # real assertion here is the status poll below, not install's exit code),
      # then polls status until healthy, checks logs, stops, and confirms stop
      # took effect.
      - name: Test CLI (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          BIN="dist/voice-typer-backend.exe"
          "$BIN" install

          echo "Waiting for stt-server to become healthy..."
          healthy=0
          for i in $(seq 1 300); do
            if "$BIN" status; then
              healthy=1
              break
            fi
            rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "::error::stt-server is not running after install"
              "$BIN" logs || true
              exit 1
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::stt-server did not become healthy within 600s"
            "$BIN" logs || true
            exit 1
          fi

          "$BIN" logs -n 20

          "$BIN" stop
          sleep 2
          if "$BIN" status; then
            echo "::error::stt-server still reports running after stop"
            exit 1
          fi
          echo "CLI smoke test passed."

      - name: Test CLI (Linux)
        if: matrix.platform == 'linux'
        run: |
          BIN="dist/voice-typer-backend"
          chmod +x "$BIN"
          "$BIN" install

          echo "Waiting for stt-server to become healthy..."
          healthy=0
          for i in $(seq 1 300); do
            if "$BIN" status; then
              healthy=1
              break
            fi
            rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "::error::stt-server is not running after install"
              "$BIN" logs || true
              exit 1
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::stt-server did not become healthy within 600s"
            "$BIN" logs || true
            exit 1
          fi

          "$BIN" logs -n 20

          "$BIN" stop
          sleep 2
          if "$BIN" status; then
            echo "::error::stt-server still reports running after stop"
            exit 1
          fi
          echo "CLI smoke test passed."

      # GPU acceleration is the same code as the CPU build — CUDA works out of the box once
      # the NVIDIA cuBLAS/cuDNN/cuda_runtime DLLs are present next to the binary (see
      # app/config.py's _cuda_dll_search_dirs, which already searches the frozen binary's own
      # directory). So instead of building and publishing an entire second ~650MB binary that's
      # otherwise byte-identical to the CPU one, package just those DLLs as a small zip that
      # `stt-server install`'s GPU auto-swap downloads and extracts on demand. Reuses
      # PyInstaller's own collect_dynamic_libs — the exact mechanism the old GPU build used to
      # find these DLLs — so the DLL set stays identical to what was already verified working.
      - name: Package CUDA runtime DLL bundle (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          venv_win/Scripts/python.exe - <<'PY'
          import os
          import shutil
          import zipfile
          from PyInstaller.utils.hooks import collect_dynamic_libs

          stage = "cuda-runtime-stage"
          os.makedirs(stage, exist_ok=True)
          for pkg in ("nvidia.cublas", "nvidia.cuda_runtime", "nvidia.cudnn"):
              try:
                  libs = collect_dynamic_libs(pkg)
              except Exception as exc:
                  print(f"Skipping {pkg}: {exc}")
                  continue
              for src, _dest in libs:
                  shutil.copy2(src, stage)
                  print(f"Staged {os.path.basename(src)}")

          staged = sorted(os.listdir(stage))
          if not staged:
              raise SystemExit("No CUDA runtime DLLs were staged — nvidia-* packages missing from this venv?")
          with zipfile.ZipFile("stt-server-windows-cuda-runtime.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for name in staged:
                  zf.write(os.path.join(stage, name), arcname=name)
          print(f"Zipped {len(staged)} DLL(s) into stt-server-windows-cuda-runtime.zip")
          PY

      - name: Stage release assets (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist/voice-typer-backend.exe release-assets/stt-server-windows-cpu.exe
          cp stt-server-windows-cuda-runtime.zip release-assets/stt-server-windows-cuda-runtime.zip

      - name: Stage release assets (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-assets
          cp dist/voice-typer-backend release-assets/stt-server-linux-cpu
          chmod +x release-assets/stt-server-linux-cpu

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stt-server-${{ matrix.platform }}
          path: release-assets/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Restore executable bit (Linux binary)
        run: chmod +x artifacts/stt-server-linux-cpu

      - name: List staged assets
        run: ls -lh artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "stt-server ${TAG}" \
            --notes "Automated build of the Voice Typer local-model runtime (faster-whisper/CTranslate2 sidecar server). Consumed by https://github.com/mariuszRep/whisper-vibes." \
            artifacts/*
