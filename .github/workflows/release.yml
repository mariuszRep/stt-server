name: Release

# Tag-triggered release: promotes the exact artifacts a successful
# candidate-server.yml run already produced for the tagged commit — it does
# NOT rebuild. Fails hard when no successful candidate run exists for
# github.sha (dispatch candidate-server.yml on the SHA first), and again if
# the fetched files don't match the candidate's SHA256SUMS manifests. The
# version in the artifacts is whatever was committed on the ref at candidate
# time — version bumps land on the branch before the final candidate run
# (candidate-server.yml's version-guard enforces this).

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    # actions:read is required for the gh run list/download calls below (this
    # job reads its own repo's Actions runs/artifacts); declaring `permissions`
    # at all zeroes out every unlisted scope, so it must be listed explicitly
    # alongside contents:write, not left to default.
    permissions:
      contents: write
      actions: read
      # Sigstore attestation (attest-build-provenance) mints an OIDC identity
      # and writes the attestation to this repo's store — both scopes are
      # required and must be listed explicitly since `permissions` zeroes the
      # rest.
      id-token: write
      attestations: write
    # No checkout in this job (it only talks to the GitHub API) — gh does not
    # read GITHUB_REPOSITORY on its own, so GH_REPO must be set explicitly or
    # every `gh run ...` / `gh release ...` call below fails to resolve a
    # target repo.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the successful candidate run for this commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Looking for a successful candidate-server.yml run on ${SHA}"
          run_id=$(gh run list --workflow candidate-server.yml --commit "${SHA}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "${run_id}" ]; then
            echo "::error::No successful candidate-server.yml run found for ${SHA}."
            echo "::error::Dispatch one first: gh workflow run candidate-server.yml --ref ${SHA}"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Found candidate run ${run_id}"

      - name: Download candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.candidate.outputs.run_id }}" --dir artifacts

      # A release must carry the complete asset set — including the
      # faster-whisper GPU variant, which candidate-server.yml only builds
      # behind its opt-in `gpu` input. A merge-triggered (or default
      # dispatch) run omits it; refuse to publish an incomplete release
      # rather than silently shipping a version that can't serve GPU installs.
      - name: Assert the candidate produced the complete artifact set
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            stt-linux-x86_64 stt-windows-x86_64.exe \
            sherpad-linux-cpu sherpad-windows-cpu \
            faster-whisper-runtime-linux-cpu \
            faster-whisper-runtime-windows-cpu \
            faster-whisper-runtime-windows-gpu; do
            if [ ! -d "artifacts/${name}" ] || [ -z "$(ls -A "artifacts/${name}")" ]; then
              echo "::error::candidate run lacks artifact '${name}'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Re-dispatch a complete candidate for this commit, then retag:"
            echo "::error::  gh workflow run candidate-server.yml --repo ${GH_REPO} --ref ${{ github.sha }} -f gpu=true"
            exit 1
          fi

      # Each artifact dir (artifacts/<artifact-name>/) carries the
      # SHA256SUMS.txt the candidate job generated beside its binary; refuse
      # to publish anything that doesn't match.
      - name: Verify checksums against candidate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          for d in artifacts/*/; do
            if [ ! -f "${d}SHA256SUMS.txt" ]; then
              echo "::error::${d} has no SHA256SUMS.txt — candidate artifacts must carry their checksum manifest"
              exit 1
            fi
            (cd "${d}" && sha256sum -c SHA256SUMS.txt)
          done
          echo "All promoted artifacts verified against candidate SHA256SUMS."

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for d in artifacts/*/; do
            name=$(basename "$d")
            for f in "$d"*; do
              case "$(basename "$f")" in
                SHA256SUMS.txt) ;;
                # Each artifact dir's manifest.json is renamed per-asset so
                # build provenance ({commit, run_id, run_url, builder,
                # built_at}) ships beside the binaries without collisions.
                manifest.json) cp "$f" "release-assets/${name}.manifest.json" ;;
                *) cp "$f" release-assets/ ;;
              esac
            done
          done
          # Publish a combined manifest so consumers can verify downloads too.
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets/

      # Cryptographic provenance for every shipped asset — recorded in this
      # repo's attestation store, verifiable with
      # `gh attestation verify <asset> --repo mariuszRep/stt-server`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATIC_NOTES="protocolVersion: 1, schemaVersion: 1 (RuntimeConnectionDescriptor). See CONVENTIONS.md/VISION.md for compatibility guarantees."
          # Append the auto-generated change list under the static line. It
          # comes from the generate-notes API (gh CLI can't combine --notes
          # with --generate-notes) and describes THIS repo's own history —
          # appropriate for a public source-repo release.
          GENERATED=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq '.body' 2>/dev/null || true)
          if [ -n "${GENERATED}" ]; then
            printf '%s\n\n## What'"'"'s Changed\n\n%s\n' "${STATIC_NOTES}" "${GENERATED}" > /tmp/release-notes.md
          else
            printf '%s\n' "${STATIC_NOTES}" > /tmp/release-notes.md
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            release-assets/*

      # Post-release housekeeping: bump to the next patch version on the
      # integration branch (not main — that's where the next round of work
      # continues from), so nobody has to remember to do it by hand before
      # the next tag. This job has no earlier checkout (it only used `gh`
      # API calls), so check out voice-typer-windows fresh, isolated in its
      # own path so it can't collide with artifacts/release-assets above.
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: voice-typer-windows
          path: source

      - name: Bump to next version on the integration branch
        working-directory: source
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          sed -i "0,/^version = \"${current}\"/s//version = \"${next}\"/" Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to ${next} (post-release)"
          git push origin voice-typer-windows
          echo "Bumped voice-typer-windows to ${next}."

  # split-current-functionality-into-three-components's Scope 7 / AC8-9: proves
  # the latest *published* @open-vibe-ai/stt-sdk actually works against *this*
  # release's faster-whisper runtime, using only installed/downloaded
  # artifacts -- no sibling repository checkout or build on either side. Runs
  # after `release` (not just `build-faster-whisper-sidecar`) specifically so
  # it downloads the real released asset via `gh release download`, the same
  # way an external consumer would get it, rather than reusing this run's own
  # workflow-artifact upload.
  sdk-compatibility:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Always the current npm "latest" dist-tag, not a hardcoded version --
      # this check's entire point is "does the SDK version consumers are
      # actually installing right now still work with this new server
      # release", which goes stale immediately if pinned to whatever version
      # existed when this job was last edited.
      - name: Install the latest published stt-sdk
        run: |
          mkdir -p /tmp/sdk-compat
          cd /tmp/sdk-compat
          npm init -y >/dev/null
          npm install @open-vibe-ai/stt-sdk@latest

      - name: Download the real released faster-whisper runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'faster-whisper-runtime-linux-cpu' \
            --dir /tmp/fw-runtime
          chmod +x /tmp/fw-runtime/faster-whisper-runtime-linux-cpu

      - name: Start the released runtime
        env:
          VOICE_TYPER_HOST: 127.0.0.1
          VOICE_TYPER_PORT: "8123"
          VOICE_TYPER_MODEL: "Systran/faster-whisper-tiny"
          VOICE_TYPER_AUTH_TOKEN: "compat-check-token"
        run: |
          /tmp/fw-runtime/faster-whisper-runtime-linux-cpu &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8123/health || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "runtime responding after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::faster-whisper runtime never became healthy"; exit 1

      - name: Run compatibility checks
        env:
          COMPAT_BASE_URL: "http://127.0.0.1:8123"
          COMPAT_TOKEN: "compat-check-token"
          COMPAT_SERVER_TAG: ${{ github.ref_name }}
          COMPAT_FIXTURE_WAV: ${{ github.workspace }}/crates/runtime/tests/fixtures/sample.wav
          COMPAT_SDK_INSTALL_DIR: /tmp/sdk-compat
        run: node scripts/sdk-compat-check.mjs
