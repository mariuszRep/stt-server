name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: stt-linux-x86_64
          - os: windows-latest
            asset: stt-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin stt
      - shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/stt.exe "dist/${{ matrix.asset }}"
          else
            cp target/release/stt "dist/${{ matrix.asset }}"
          fi
      - name: Audit release artifact
        shell: bash
        run: bash scripts/verify-release-artifact.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # Builds the managed faster-whisper runtime as a standalone PyInstaller
  # binary, reusing whisper-vibes/.github/workflows/desktop-build.yml's
  # VOICE_TYPER_BUILD_VARIANT pattern. GPU (bundled CUDA/cuDNN DLLs, much
  # larger) is Windows-only — CUDA acceleration only matters for the
  # Windows Tauri consumer; the CPU variant covers Linux/dev use.
  #
  # PyInstaller's spec always names its output `voice-typer-backend[.exe]`
  # regardless of variant, so without renaming, the cpu and gpu legs on the
  # same OS would upload two files with an identical name and collide. Each
  # leg renames its output to `stt-runtime`'s own
  # `faster-whisper-runtime-{os}-{variant}{ext}` convention
  # (`crates/runtime/src/providers/faster_whisper.rs::asset_name`) before
  # upload, which is also the exact filename `download_variant` requests at
  # install time — this naming is a contract between the two, not cosmetic.
  build-faster-whisper-sidecar:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_slug: linux
            variant: cpu
            ext: ""
          - os: windows-latest
            os_slug: windows
            variant: cpu
            ext: ".exe"
          - os: windows-latest
            os_slug: windows
            variant: gpu
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtimes/faster-whisper
    env:
      VOICE_TYPER_BUILD_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          python -m venv venv
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            venv/Scripts/pip install -r requirements.txt pyinstaller
            venv/Scripts/pyinstaller --clean --noconfirm voice-typer-backend.spec
          else
            venv/bin/pip install -r requirements.txt pyinstaller
            venv/bin/pyinstaller --clean --noconfirm voice-typer-backend.spec
          fi
      - name: Rename to the faster-whisper-runtime-{os}-{variant} release-asset convention
        shell: bash
        run: |
          mv "dist/voice-typer-backend${{ matrix.ext }}" \
             "dist/faster-whisper-runtime-${{ matrix.os_slug }}-${{ matrix.variant }}${{ matrix.ext }}"
      - name: Audit release artifact
        shell: bash
        run: bash ../../scripts/verify-release-artifact.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-runtime-${{ matrix.os_slug }}-${{ matrix.variant }}
          path: runtimes/faster-whisper/dist/faster-whisper-runtime-${{ matrix.os_slug }}-${{ matrix.variant }}${{ matrix.ext }}

  # Builds the sherpa-onnx managed runtime (sherpad) as a standalone binary.
  # Upstream k2-fsa/sherpa-onnx ships no server conforming to this project's
  # local provider protocol (only demo binaries and its own bespoke
  # WebSocket-server protocol — verified directly against its releases, see
  # generalize-provider-engine-installation's goal notes), so — like
  # faster-whisper — stt-server builds and hosts this binary itself rather
  # than fetching a ready-made one from sherpa-onnx's own releases. CPU-only
  # today (sherpad links a CPU-only onnxruntime build; GPU is a separate
  # future goal), so there is only one variant per OS, unlike
  # faster-whisper's cpu/gpu split. The asset name
  # (`sherpad-{os}-cpu{ext}`) is the exact contract
  # add-sherpa-onnx-provider's `download_variant` resolves against.
  build-sherpad:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_slug: linux
            ext: ""
          - os: windows-latest
            os_slug: windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtimes/sherpa-onnx
    env:
      # See the matching comment in ci.yml's `sherpad` job: audiopus_sys's
      # vendored libopus CMakeLists predates CMake 3.5's minimum-version
      # floor, so a current CMake (the runner images' default) refuses to
      # configure it without this.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/sherpa-onnx
      - run: cargo build --release --bin sherpad
      - name: Rename to the sherpad-{os}-cpu release-asset convention
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/sherpad${{ matrix.ext }}" "dist/sherpad-${{ matrix.os_slug }}-cpu${{ matrix.ext }}"
      - name: Audit release artifact
        shell: bash
        run: bash ../../scripts/verify-release-artifact.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: sherpad-${{ matrix.os_slug }}-cpu
          path: runtimes/sherpa-onnx/dist/sherpad-${{ matrix.os_slug }}-cpu${{ matrix.ext }}

  release:
    needs: [build-binaries, build-faster-whisper-sidecar, build-sherpad]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "protocolVersion: 1, schemaVersion: 1 (RuntimeConnectionDescriptor). See CONVENTIONS.md/VISION.md for compatibility guarantees." \
            artifacts/*/*

  # Gated: @open-vibe-ai/stt-sdk does have a real npm publish pipeline
  # (stt-sdk/.github/workflows/release.yml, OIDC trusted publishing), but
  # there is no confirmed-consumable published version yet — stt-sdk's
  # source version and its actual npm-published version have drifted (see
  # RELEASE_PROCESS.md's SDK version-drift checklist item; check with
  # `node scripts/release-status.mjs` from the voice-typer workspace root).
  # This job is real — not a placeholder — but is intentionally left
  # unreachable (`if: false` below) rather than silently skipped, so it's
  # obvious the requirement isn't satisfied yet rather than looking like it
  # passed. Flip `if: false` once the SDK version drift is resolved and pin
  # @open-vibe-ai/stt-sdk@<version> below.
  sdk-compatibility:
    if: false
    needs: [build-faster-whisper-sidecar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install @open-vibe-ai/stt-sdk # pin an exact version once published
      - run: |
          echo "TODO: start a managed runtime and run stt-sdk's protocol fixtures against its descriptor"
